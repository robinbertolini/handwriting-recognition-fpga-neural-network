<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riconoscitore di Lettere - ZedBoard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .main-area {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .canvas-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #drawCanvas {
            border: 3px solid #667eea;
            border-radius: 15px;
            cursor: crosshair;
            background-color: #fafafa;
            box-shadow: 0 5px 15px rgba(102,126,234,0.2);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.2s ease;
            color: white;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #clear-btn { background: linear-gradient(135deg, #f093fb, #f5576c); }
        #delete-btn { background: linear-gradient(135deg, #fa709a, #fee140); color: #333; }
        #save-btn { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        #send-btn { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #333; }
        .queue-section { flex: 1; min-width: 250px; }
        .queue-title {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
            font-weight: 600;
        }
        #queue {
            border: 2px dashed #ccc;
            border-radius: 15px;
            padding: 15px;
            min-height: 200px;
            background: #fafafa;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-content: flex-start;
        }
        .queue-empty {
            color: #aaa;
            font-style: italic;
            width: 100%;
            text-align: center;
            padding-top: 80px;
            font-size: 14px;
        }
        .queue-item {
            position: relative;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            box-shadow: 0 3px 8px rgba(102,126,234,0.2);
            animation: popIn 0.3s ease;
        }
        .queue-item img {
            display: block;
            width: 70px;
            height: 70px;
            border-radius: 8px;
        }
        .queue-item .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #f5576c;
            color: white;
            border: 2px solid white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        #status {
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
            background: #e8f4f8;
            color: #2c7a9c;
            border-left: 4px solid #2c7a9c;
        }
        #status.error { background: #ffe8e8; color: #c0392b; border-left-color: #c0392b; }
        #status.success { background: #e8f8ec; color: #27ae60; border-left-color: #27ae60; }
        #status.waiting { background: #fff8e1; color: #f39c12; border-left-color: #f39c12; }
    </style>
</head>
<body>
<div class="container">
    <h1>✏️ Riconoscitore di Lettere</h1>
    <p class="subtitle">Disegna una lettera e inviala alla ZedBoard (input 10x10 = 100 byte)</p>

    <div class="main-area">
        <div class="canvas-section">
            <canvas id="drawCanvas" width="250" height="250"></canvas>
            <div class="controls">
                <button id="clear-btn">🗑️ Cancella Tutto</button>
                <button id="save-btn">💾 Salva Lettera</button>
            </div>
            <div class="controls">
                <button id="delete-btn">↩️ Cancella Ultima</button>
                <button id="send-btn">🚀 Invia Parola</button>
            </div>
        </div>
        <div class="queue-section">
            <div class="queue-title">Coda Lettere (<span id="queue-count">0</span>)</div>
            <div id="queue">
                <div class="queue-empty">Nessuna lettera in coda.<br>Disegna e premi "Salva Lettera".</div>
            </div>
        </div>
    </div>
    <div id="status">Pronto. Disegna una lettera per iniziare.</div>
</div>

<script>
// ============================================================
// CONFIGURAZIONE
// ============================================================
const CANVAS_SIZE = 250;          // Dimensione canvas
const INPUT_SIZE = 10;            // Input rete: 10x10 = 100 byte
const BAUD_RATE = 115200;         // Baud rate UART
const PIXEL_THRESHOLD = 128;      // Soglia bianco/nero

// ============================================================
// RIFERIMENTI DOM
// ============================================================
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const queueDiv = document.getElementById('queue');
const statusDiv = document.getElementById('status');
const queueCountSpan = document.getElementById('queue-count');

// ============================================================
// STATO
// ============================================================
let isDrawing = false;
let letterQueue = [];

// ============================================================
// SETUP CANVAS
// ============================================================
ctx.lineWidth = 16;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = '#000000';

// ============================================================
// FUNZIONI DISEGNO
// ============================================================
function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}
function startDrawing(e) {
    isDrawing = true;
    const { x, y } = getCanvasCoords(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
}
function draw(e) {
    if (!isDrawing) return;
    const { x, y } = getCanvasCoords(e);
    ctx.lineTo(x, y);
    ctx.stroke();
}
function stopDrawing() {
    isDrawing = false;
    ctx.beginPath();
}
canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseout', stopDrawing);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
canvas.addEventListener('touchend', stopDrawing);

// ============================================================
// CONVERSIONE CANVAS -> INPUT 10x10 (100 byte)
// ============================================================
function canvasToInput() {
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = INPUT_SIZE;
    tmpCanvas.height = INPUT_SIZE;
    const tmpCtx = tmpCanvas.getContext('2d');
    tmpCtx.drawImage(canvas, 0, 0, INPUT_SIZE, INPUT_SIZE);
    const imageData = tmpCtx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE);
    const data = imageData.data;
    const pixels = new Uint8Array(INPUT_SIZE * INPUT_SIZE);  // 100 byte
    for (let i = 0; i < pixels.length; i++) {
        const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
        const brightness = (r + g + b) / 3;
        // 0 = sfondo, 255 = tratto nero
        pixels[i] = (brightness < PIXEL_THRESHOLD) ? 255 : 0;
    }
    return pixels;
}

// ============================================================
// GESTIONE CODA
// ============================================================
function updateQueueDisplay() {
    queueDiv.innerHTML = '';
    queueCountSpan.textContent = letterQueue.length;
    if (letterQueue.length === 0) {
        queueDiv.innerHTML = '<div class="queue-empty">Nessuna lettera in coda.<br>Disegna e premi "Salva Lettera".</div>';
        return;
    }
    letterQueue.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'queue-item';
        const img = document.createElement('img');
        img.src = item.thumbnail;
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = '×';
        removeBtn.title = 'Rimuovi questa lettera';
        removeBtn.addEventListener('click', () => {
            letterQueue.splice(index, 1);
            updateQueueDisplay();
            setStatus('Lettera rimossa dalla coda.', '');
        });
        div.appendChild(img);
        div.appendChild(removeBtn);
        queueDiv.appendChild(div);
    });
}
function setStatus(message, type = '') {
    statusDiv.textContent = message;
    statusDiv.className = type;
}

// ============================================================
// BOTTONI
// ============================================================
document.getElementById('clear-btn').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    letterQueue = [];
    updateQueueDisplay();
    setStatus('Tela e coda pulite.', '');
});

document.getElementById('save-btn').addEventListener('click', () => {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let isEmpty = true;
    for (let i = 0; i < imageData.data.length; i += 4) {
        if (imageData.data[i+3] > 0 && imageData.data[i] < PIXEL_THRESHOLD) {
            isEmpty = false; break;
        }
    }
    if (isEmpty) {
        setStatus('La tela è vuota! Disegna qualcosa prima di salvare.', 'error');
        return;
    }
    const cnnPixels = canvasToInput();
    // Crea miniatura
    const thumbCanvas = document.createElement('canvas');
    thumbCanvas.width = 70; thumbCanvas.height = 70;
    const thumbCtx = thumbCanvas.getContext('2d');
    thumbCtx.fillStyle = '#ffffff';
    thumbCtx.fillRect(0, 0, 70, 70);
    thumbCtx.drawImage(canvas, 0, 0, 70, 70);
    const thumbnail = thumbCanvas.toDataURL('image/png');
    letterQueue.push({ imageData: cnnPixels, thumbnail });
    updateQueueDisplay();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setStatus(`Lettera salvata! (${letterQueue.length} in coda)`, 'success');
});

document.getElementById('delete-btn').addEventListener('click', () => {
    if (letterQueue.length > 0) {
        letterQueue.pop();
        updateQueueDisplay();
        setStatus('Ultima lettera rimossa.', '');
    } else {
        setStatus('Nessuna lettera da rimuovere.', 'error');
    }
});

document.getElementById('send-btn').addEventListener('click', async () => {
    if (letterQueue.length === 0) {
        setStatus('Nessuna lettera da inviare!', 'error');
        return;
    }
    if (!('serial' in navigator)) {
        setStatus('Web Serial API non supportata. Usa Chrome o Edge.', 'error');
        return;
    }
    try {
        setStatus('Richiesta porta seriale... Seleziona la porta della ZedBoard.', 'waiting');
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: BAUD_RATE });
        setStatus('Porta aperta. Invio lettere...', 'waiting');
        const writer = port.writable.getWriter();
        for (let i = 0; i < letterQueue.length; i++) {
            const letter = letterQueue[i];
            setStatus(`Invio lettera ${i+1} di ${letterQueue.length}...`, 'waiting');
            await writer.write(letter.imageData);  // Invia 100 byte
            await new Promise(r => setTimeout(r, 200));  // Pausa tra lettere
        }
        writer.releaseLock();
        await port.close();
        setStatus(`✅ ${letterQueue.length} lettere inviate con successo!`, 'success');
        letterQueue = [];
        updateQueueDisplay();
    } catch (error) {
        console.error('Errore seriale:', error);
        setStatus('Errore di comunicazione: ' + error.message, 'error');
    }
});

updateQueueDisplay();
</script>
</body>
</html>
