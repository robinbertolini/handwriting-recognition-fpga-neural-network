<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riconoscitore di Lettere - ZedBoard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 1400px;
            margin: auto;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }

        .main-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }
        .canvas-section { display: flex; flex-direction: column; align-items: center; }
        #drawCanvas {
            border: 3px solid #667eea;
            border-radius: 15px;
            cursor: crosshair;
            background-color: #ffffff;
        }
        .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
            border: none; border-radius: 10px; color: white;
        }
        button:hover { opacity: 0.9; }
        #clear-btn { background: #f5576c; }
        #delete-btn { background: #fa709a; color: #333; }
        #save-btn { background: #4facfe; }
        #send-btn { background: #43e97b; color: #333; }

        .right-panel { display: flex; flex-direction: column; gap: 20px; min-width: 260px; flex: 1; }
        .queue-section { width: 100%; }
        .queue-title { font-size: 16px; color: #555; margin-bottom: 10px; font-weight: 600; }
        #queue {
            border: 2px dashed #ccc; border-radius: 15px; padding: 15px;
            min-height: 100px; background: #fafafa; display: flex;
            flex-wrap: wrap; gap: 10px; align-content: flex-start;
        }
        .queue-empty { color: #aaa; font-style: italic; width: 100%; text-align: center; padding-top: 25px; font-size: 14px; }
        .queue-item {
            position: relative; border: 2px solid #667eea; border-radius: 10px;
            background: white; padding: 4px;
        }
        .queue-item img { display: block; width: 60px; height: 60px; border-radius: 6px; }
        .queue-item .remove-btn {
            position: absolute; top: -8px; right: -8px; width: 22px; height: 22px;
            border-radius: 50%; background: #f5576c; color: white; border: 2px solid white;
            font-size: 12px; font-weight: bold; cursor: pointer; padding: 0;
        }
        #status {
            margin-top: 20px; padding: 12px 20px; border-radius: 10px;
            font-size: 14px; text-align: center; font-weight: 500;
            background: #e8f4f8; color: #2c7a9c; border-left: 4px solid #2c7a9c;
        }
        #status.error { background: #ffe8e8; color: #c0392b; }
        #status.success { background: #e8f8ec; color: #27ae60; }
        #status.waiting { background: #fff8e1; color: #f39c12; }

        /* BOX DEBUG */
        .debug-section {
            width: 100%;
            margin-top: 20px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 15px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            max-height: 500px;
            overflow: auto;
        }
        .debug-section h3 {
            color: #569cd6;
            margin-bottom: 15px;
            font-size: 16px;
            font-family: 'Segoe UI', sans-serif;
        }
        #debug-grid {
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.2;
            white-space: pre;
            color: #4ec9b0;
            letter-spacing: 2px;
            margin: 10px 0;
        }
        #debug-info {
            color: #dcdcaa;
            margin-bottom: 10px;
        }
        #debug-log {
            white-space: pre-wrap;
            color: #ce9178;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #3c3c3c;
            max-height: 200px;
            overflow: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✏️ Riconoscitore di Lettere</h1>
    <p class="subtitle">Disegna una lettera e inviala alla ZedBoard (input 14x14 = 196 byte)</p>

    <div class="main-area">
        <div class="canvas-section">
            <canvas id="drawCanvas" width="280" height="280"></canvas>
            <div class="controls">
                <button id="clear-btn">🧹 Pulisci Tela</button>
                <button id="save-btn">💾 Salva Lettera</button>
            </div>
            <div class="controls">
                <button id="delete-btn">↩️ Cancella Ultima</button>
                <button id="send-btn">🚀 Invia Parola</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="queue-section">
                <div class="queue-title">Coda Lettere (<span id="queue-count">0</span>)</div>
                <div id="queue">
                    <div class="queue-empty">Nessuna lettera in coda.</div>
                </div>
            </div>
        </div>
    </div>

    <div id="status">Pronto. Disegna una lettera per iniziare.</div>

    <!-- ============================================ -->
    <!-- BOX DEBUG: mostra cosa viene elaborato -->
    <!-- ============================================ -->
    <div class="debug-section">
        <h3>🔍 Debug (visibile automaticamente)</h3>
        <div id="debug-info">In attesa di una lettera...</div>
        <div id="debug-grid"></div>
        <div id="debug-log"></div>
    </div>
</div>

<script>
const INPUT_SIZE = 14;
const BAUD_RATE = 115200;
const PIXEL_THRESHOLD = 128;
const LINE_WIDTH = 22;

const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const queueDiv = document.getElementById('queue');
const statusDiv = document.getElementById('status');
const queueCountSpan = document.getElementById('queue-count');
const debugInfo = document.getElementById('debug-info');
const debugGrid = document.getElementById('debug-grid');
const debugLog = document.getElementById('debug-log');

let isDrawing = false;
let letterQueue = [];

ctx.lineWidth = LINE_WIDTH;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = '#000000';
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, canvas.width, canvas.height);

function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
}
function startDrawing(e) { isDrawing = true; const p = getCanvasCoords(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
function draw(e) { if (!isDrawing) return; const p = getCanvasCoords(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
function stopDrawing() { isDrawing = false; ctx.beginPath(); }

canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseout', stopDrawing);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
canvas.addEventListener('touchend', stopDrawing);

function canvasToInput() {
    const fullData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
    let found = false;
    for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
            const i = (y * canvas.width + x) * 4;
            const r = fullData[i], g = fullData[i+1], b = fullData[i+2], a = fullData[i+3];
            if (a > 128 && (r + g + b) / 3 < PIXEL_THRESHOLD) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
                found = true;
            }
        }
    }
    if (!found) return new Uint8Array(INPUT_SIZE * INPUT_SIZE);

    const cropW = maxX - minX, cropH = maxY - minY;
    const margin = Math.max(cropW, cropH) * 0.15;
    minX = Math.max(0, minX - margin);
    minY = Math.max(0, minY - margin);
    maxX = Math.min(canvas.width, maxX + margin);
    maxY = Math.min(canvas.height, maxY + margin);

    const w = maxX - minX, h = maxY - minY;
    const size = Math.max(w, h);
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    const squareX = centerX - size / 2;
    const squareY = centerY - size / 2;

    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = INPUT_SIZE;
    tmpCanvas.height = INPUT_SIZE;
    const tmpCtx = tmpCanvas.getContext('2d');
    tmpCtx.fillStyle = '#ffffff';
    tmpCtx.fillRect(0, 0, INPUT_SIZE, INPUT_SIZE);
    tmpCtx.drawImage(canvas, squareX, squareY, size, size, 0, 0, INPUT_SIZE, INPUT_SIZE);

    const imageData = tmpCtx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE);
    const data = imageData.data;
    const pixels = new Uint8Array(INPUT_SIZE * INPUT_SIZE);
    for (let i = 0; i < pixels.length; i++) {
        const r = data[i*4], g = data[i*4+1], b = data[i*4+2], a = data[i*4+3];
        if (a < 128) {
            pixels[i] = 0;
        } else {
            const brightness = (r + g + b) / 3;
            pixels[i] = (brightness < PIXEL_THRESHOLD) ? 255 : 0;
        }
    }
    return pixels;
}

// Mostra la griglia nel box debug
function showGridInDebug(pixels, label = '') {
    let gridStr = '';
    for (let row = 0; row < 14; row++) {
        let line = '';
        for (let col = 0; col < 14; col++) {
            line += pixels[row * 14 + col] ? '█' : '·';
        }
        gridStr += line + '\n';
    }
    debugGrid.textContent = gridStr;

    const bytes = Array.from(pixels);
    const ones = bytes.filter(b => b > 0).length;
    const nonZeroNonOne = bytes.filter(b => b > 1).length;

    debugInfo.innerHTML = `
        <span style="color:#4ec9b0">${label}</span> |
        Totale: <b>${bytes.length}</b> byte |
        Byte = 1: <b>${ones}</b> |
        Pixel attivi (valore alto): <b style="color:${nonZeroNonOne > 0 ? '#f48771' : '#4ec9b0'}">${nonZeroNonOne}</b> |
        Primi 14 byte: <code>${bytes.slice(0, 14).join(',')}</code>
    `;

    // Log testuale
    let logText = `Griglia 14x14 (${ones} pixel attivi, ${nonZeroNonOne} byte anomali):\n`;
    logText += gridStr;
    logText += `\nPrimi 20 byte: ${bytes.slice(0, 20).join(',')}\n`;
    logText += `Byte [90..100]: ${bytes.slice(90, 101).join(',')}\n`;
    logText += `Ultimi 20 byte: ${bytes.slice(-20).join(',')}\n`;
    if (nonZeroNonOne > 0) {
        logText += `\n⚠️ ATTENZIONE: ${nonZeroNonOne} byte hanno valore > 1!\n`;
        logText += `Posizioni: ${bytes.map((b, i) => b > 1 ? `${i}=${b}` : null).filter(x => x).join(', ')}\n`;
    }
    debugLog.textContent = logText;
}

function updateQueueDisplay() {
    queueDiv.innerHTML = '';
    queueCountSpan.textContent = letterQueue.length;
    if (letterQueue.length === 0) {
        queueDiv.innerHTML = '<div class="queue-empty">Nessuna lettera in coda.</div>';
        return;
    }
    letterQueue.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'queue-item';
        const img = document.createElement('img');
        img.src = item.thumbnail;
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => {
            letterQueue.splice(index, 1);
            updateQueueDisplay();
        });
        div.appendChild(img);
        div.appendChild(removeBtn);
        queueDiv.appendChild(div);
    });
}

function setStatus(message, type = '') {
    statusDiv.textContent = message;
    statusDiv.className = type;
}

document.getElementById('clear-btn').addEventListener('click', () => {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    debugInfo.textContent = 'Tela pulita. Disegna una nuova lettera.';
    debugGrid.textContent = '';
    debugLog.textContent = '';
    setStatus('Tela pulita.', '');
});

document.getElementById('save-btn').addEventListener('click', () => {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let isEmpty = true;
    for (let i = 0; i < imageData.data.length; i += 4) {
        if (imageData.data[i+3] > 0 && imageData.data[i] < PIXEL_THRESHOLD) {
            isEmpty = false; break;
        }
    }
    if (isEmpty) {
        setStatus('La tela è vuota! Disegna qualcosa prima di salvare.', 'error');
        return;
    }
    const cnnPixels = canvasToInput();
    const thumbCanvas = document.createElement('canvas');
    thumbCanvas.width = 60; thumbCanvas.height = 60;
    const thumbCtx = thumbCanvas.getContext('2d');
    thumbCtx.fillStyle = '#ffffff';
    thumbCtx.fillRect(0, 0, 60, 60);
    thumbCtx.drawImage(canvas, 0, 0, 60, 60);
    const thumbnail = thumbCanvas.toDataURL('image/png');
    letterQueue.push({ imageData: cnnPixels, thumbnail });

    // Mostra la griglia nel box debug
    showGridInDebug(cnnPixels, `LETTERA ${letterQueue.length} SALVATA`);

    updateQueueDisplay();
    setStatus(`Lettera salvata! (${letterQueue.length} in coda)`, 'success');
});

document.getElementById('delete-btn').addEventListener('click', () => {
    if (letterQueue.length > 0) {
        letterQueue.pop();
        updateQueueDisplay();
        setStatus('Ultima lettera rimossa.', '');
    } else {
        setStatus('Nessuna lettera da rimuovere.', 'error');
    }
});

function buildFrame(pixels) {
    const f = new Uint8Array(199);
    f[0] = 0xA5; f[1] = 0x5A;
    let s = 0;
    for (let i = 0; i < 196; i++) {
        const v = pixels[i] ? 1 : 0;
        f[2 + i] = v;
        s = (s + v) & 0xFF;
    }
    f[198] = s;
    return f;
}

document.getElementById('send-btn').addEventListener('click', async () => {
    if (letterQueue.length === 0) { setStatus('Nessuna lettera da inviare!', 'error'); return; }
    if (!('serial' in navigator)) { setStatus('Web Serial API non supportata. Usa Chrome o Edge.', 'error'); return; }
    try {
        setStatus('Richiesta porta seriale...', 'waiting');
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: BAUD_RATE });
        const writer = port.writable.getWriter();
        await new Promise(r => setTimeout(r, 300));
        for (let i = 0; i < letterQueue.length; i++) {
            const frame = buildFrame(letterQueue[i].imageData);
            showGridInDebug(letterQueue[i].imageData, `INVIO ${i+1}/${letterQueue.length}`);
            setStatus(`Invio lettera ${i+1} di ${letterQueue.length}...`, 'waiting');
            for (let j = 0; j < frame.length; j++) {
                await writer.write(new Uint8Array([frame[j]]));
                await new Promise(r => setTimeout(r, 5));
            }
            await new Promise(r => setTimeout(r, 600));
        }
        writer.releaseLock();
        await port.close();
        setStatus(`✅ ${letterQueue.length} lettere inviate (frame con header A5 5A + checksum)`, 'success');
        letterQueue = [];
        updateQueueDisplay();
    } catch (error) {
        setStatus('Errore: ' + error.message, 'error');
    }
});

updateQueueDisplay();
</script>
</body>
</html>
